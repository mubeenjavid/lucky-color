<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="Discover your lucky color for today. One color, one day, a little bit of fun.">
  <title>Your Lucky Color Today</title>
  <style>
    :root { color-scheme: light; --ink: #202020; --paper: #f4f0e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); display: grid; place-items: center; transition: background .45s ease, color .25s ease; }
    main { width: min(100% - 36px, 720px); text-align: center; padding: 52px 0 36px; }
    .eyebrow { font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; opacity: .68; font-weight: 700; }
    h1 { font-size: clamp(2.5rem, 9vw, 5.7rem); line-height: .98; letter-spacing: -.07em; margin: 22px 0 14px; }
    .subtitle { font-size: clamp(1rem, 2.7vw, 1.2rem); line-height: 1.6; opacity: .78; margin: 0 auto; max-width: 440px; }
    .color-card { margin: 34px auto 22px; width: min(100%, 440px); height: 230px; border-radius: 26px; background: var(--lucky, #f4c542); box-shadow: 0 20px 60px #00000012; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background .45s ease; }
    .color-name { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -.04em; }
    .hex { margin-top: 8px; font-size: .95rem; font-weight: 650; letter-spacing: .12em; opacity: .78; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
    button { border: 0; border-radius: 999px; padding: 14px 22px; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s ease, opacity .15s ease; }
    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
    .primary { background: var(--ink); color: white; }
    .secondary { background: transparent; color: var(--ink); border: 1px solid #00000030; }
    .note { font-size: .83rem; opacity: .65; margin-top: 20px; }
    footer { margin-top: 48px; font-size: .78rem; opacity: .6; }
    @media (max-width: 480px) { main { padding-top: 35px; } .color-card { height: 200px; border-radius: 20px; } button { padding: 13px 18px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow" id="today">Your color for today</div>
    <h1>Your Lucky<br>Color.</h1>
    <p class="subtitle">A tiny daily ritual. One color picked just for today. What will yours be?</p>

    <section class="color-card" id="colorCard" aria-live="polite" aria-label="Today's lucky color">
      <div class="color-name" id="colorName">Golden Yellow</div>
      <div class="hex" id="colorHex">#F4C542</div>
    </section>

    <div class="actions">
      <button class="primary" id="shareBtn">Share my color ↗</button>
      <button class="secondary" id="copyBtn">Copy color code</button>
    </div>
    <p class="note" id="message">Your color stays the same for everyone today.</p>
    <footer>Just for fun — let your day have a little color.</footer>
  </main>
  <script>
    const colors = [
      { name: "Golden Yellow", hex: "#F4C542" },
      { name: "Ocean Blue", hex: "#3C91E6" },
      { name: "Coral Pink", hex: "#F27D7D" },
      { name: "Mint Green", hex: "#76C7A5" },
      { name: "Lavender", hex: "#B8A1E3" },
      { name: "Sunset Orange", hex: "#F28C45" },
      { name: "Cherry Red", hex: "#E94B5A" },
      { name: "Sky Blue", hex: "#8ED6F5" },
      { name: "Soft Peach", hex: "#F6BFA7" },
      { name: "Forest Green", hex: "#39745B" },
      { name: "Lilac", hex: "#D6B4FC" },
      { name: "Midnight Navy", hex: "#263859" }
    ];

    // A deterministic daily selection: all visitors see the same color on the same date.
    const now = new Date();
    const dateKey = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
    let seed = 0;
    for (const char of dateKey) seed = (seed * 31 + char.charCodeAt(0)) >>> 0;
    const chosen = colors[seed % colors.length];

    document.getElementById("today").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    document.getElementById("colorName").textContent = chosen.name;
    document.getElementById("colorHex").textContent = chosen.hex;
    document.getElementById("colorCard").style.setProperty("--lucky", chosen.hex);
    document.getElementById("colorCard").style.background = chosen.hex;
    document.querySelector('meta[name="theme-color"]').content = chosen.hex;

    function contrast(hex) {
      const rgb = hex.match(/[a-f\d]{2}/gi).map(x => parseInt(x, 16) / 255).map(v => v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
      return .2126 * rgb[0] + .7152 * rgb[1] + .0722 * rgb[2] > .42 ? "#202020" : "#ffffff";
    }
    document.getElementById("colorCard").style.color = contrast(chosen.hex);

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const msg = document.getElementById("message");
      try {
        await navigator.clipboard.writeText(`${chosen.name} ${chosen.hex}`);
        msg.textContent = "Copied! Share your lucky color with a friend.";
      } catch {
        msg.textContent = `Your lucky color is ${chosen.name} (${chosen.hex}).`;
      }
    });

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const shareData = { title: "My Lucky Color Today", text: `My lucky color today is ${chosen.name} (${chosen.hex}). What's yours?`, url: location.href };
      const msg = document.getElementById("message");
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) { /* share dialog closed */ }
      } else {
        try {
          await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`);
          msg.textContent = "Share message copied! Send it to a friend.";
        } catch {
          msg.textContent = shareData.text;
        }
      }
    });
  </script>
</body>
</html>
